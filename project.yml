name: Ledge
options:
  bundleIdPrefix: com.gshimoon
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

# Signing lives in Config/Signing.xcconfig (ad hoc by default; see that file).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # The private frameworks ship .tbd stubs inside the SDK.
    FRAMEWORK_SEARCH_PATHS: "$(inherited) $(SDKROOT)/System/Library/PrivateFrameworks"

targets:
  Ledge:
    type: application
    platform: macOS
    sources:
      - path: Ledge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gshimoon.ledge
        PRODUCT_NAME: Ledge
        INFOPLIST_FILE: Ledge/Info.plist
        CODE_SIGN_ENTITLEMENTS: Ledge/Ledge.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: Ledge/Bridge/Ledge-Bridging-Header.h
        OTHER_LDFLAGS: "$(inherited) -framework MultitouchSupport -framework MediaRemote"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

schemes:
  Ledge:
    build:
      targets:
        Ledge: all
    run:
      config: Debug
    archive:
      config: Release
